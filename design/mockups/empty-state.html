<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Counterfoil — Empty state</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;color:#1d1d1f;--muted:#8b8b91;--line:rgba(35,35,40,.1)}*{box-sizing:border-box}body{margin:0;background:#e9e8e6;min-height:100vh;padding:72px 10vw}.window{height:650px;max-width:1020px;margin:auto;border-radius:17px;overflow:hidden;display:grid;grid-template-columns:278px 1fr;background:#fbfbfd;box-shadow:0 30px 70px rgba(0,0,0,.17)}.sidebar{background:rgba(242,242,245,.9);border-right:1px solid var(--line)}.traffic{height:46px;display:flex;gap:8px;align-items:center;padding:0 18px}.traffic i{display:block;width:12px;height:12px;border-radius:50%}.traffic i:nth-child(1){background:#ff6058}.traffic i:nth-child(2){background:#ffbd2e}.traffic i:nth-child(3){background:#28c840}.search{height:31px;margin:0 14px;border-radius:8px;background:rgba(118,118,128,.12);color:#8a8a90;padding:7px 10px;font-size:13px}.bottom{position:absolute;bottom:0;width:278px;height:49px;border-top:1px solid var(--line);padding:11px 16px;color:#6d6d73;font-size:20px}.content{position:relative;background:rgba(255,255,255,.62)}.content .traffic{border-bottom:1px solid var(--line)}.empty{position:absolute;inset:46px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:translateY(-12px)}.glyph{width:84px;height:84px;border-radius:25px;background:rgba(118,118,128,.08);display:flex;align-items:center;justify-content:center;margin-bottom:22px}.glyph svg{width:51px;height:51px;overflow:visible}.empty h1{font-size:22px;letter-spacing:-.02em;margin:0;font-weight:600}.soft{position:absolute;width:310px;height:150px;border-radius:50%;background:rgba(238,143,130,.06);filter:blur(35px);bottom:92px}
  </style>
</head>
<body><section class="window"><aside class="sidebar"><div class="traffic"><i></i><i></i><i></i></div><div class="search">⌕ <span>Search meetings</span></div><div class="bottom">＋</div></aside><main class="content"><div class="traffic"><i></i><i></i><i></i></div><div class="soft"></div><div class="empty"><div class="glyph"><svg viewBox="0 0 64 64" fill="none" stroke="#9c9ca2" stroke-width="2.2" stroke-linecap="round"><path d="M6 34c5 0 5-6 10-6s5 14 10 14 5-24 10-24 5 28 10 28 5-12 12-12" opacity=".72"/><path d="M6 46c5 0 5-5 10-5s5 8 10 8 5-13 10-13 5 15 10 15 5-6 12-6" opacity=".3"/></svg></div><h1>No meetings yet</h1></div></main></section></body>
</html>
